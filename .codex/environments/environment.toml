version = 1
name = "maurie-app"

[setup]
script = '''
cd "$CODEX_WORKTREE_PATH"

corepack enable

if ! command -v pnpm >/dev/null 2>&1; then
  corepack prepare pnpm@latest --activate
fi

pnpm install
pnpm exec prisma generate
'''

[cleanup]
script = '''
cd "$CODEX_WORKTREE_PATH"

rm -rf .pnpm-store
rm -rf .next
rm -rf .turbo
rm -rf .cache
'''
